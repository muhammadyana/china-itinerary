# Installed as /etc/nginx/snippets/china-itinerary-expenses.conf and included in the 443 server block.
location /api/shared-expenses/ {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}
