server {
    listen 80;
    server_name china.muhammadyana.me;

    location ^~ /.well-known/acme-challenge/ {
        root /home/deploy/apps/china.muhammadyana.me/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://china.muhammadyana.me$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name china.muhammadyana.me;
    root /home/deploy/apps/china.muhammadyana.me/current/public;
    # Inline copy of ops/ask/nginx-ask.conf; on the server, ops/ask/install.sh includes
    # snippets/china-itinerary-ask.conf at this position.
    location /api/ask/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        client_max_body_size 64k;
    }
    index index.html;

    ssl_certificate /etc/letsencrypt/live/china.muhammadyana.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/china.muhammadyana.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /home/deploy/apps/china.muhammadyana.me/shared/log/access.log;
    error_log /home/deploy/apps/china.muhammadyana.me/shared/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /home/deploy/apps/china.muhammadyana.me/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
