name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-itinerary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Chromium renders the PDF during the build. CI runs no tests (owner's decision, 6 November 2026).
      - run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Package static site
        run: python3 ops/package.py "$GITHUB_SHA" site.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Nginx
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://china.muhammadyana.me
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-${{ github.sha }}
      - name: Upload and activate verified release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -T -i "$key_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < site.tar.gz
      - name: Verify public HTTPS release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "https://china.muhammadyana.me/release.json?revision=$GITHUB_SHA" > release.json
          jq -e '.revision == env.GITHUB_SHA' release.json
          curl --fail --silent --show-error --max-time 30 \
            https://china.muhammadyana.me/ > index.html
          grep -q 'hero-track' index.html
          for slug in jiuzhaigou dali sifangjie; do
            curl --fail --silent --show-error --max-time 30 \
              "https://china.muhammadyana.me/places/$slug/?revision=$GITHUB_SHA" > "guide-$slug.html"
            grep -q "data-guide=\"$slug\"" "guide-$slug.html"
          done
          printf '### Deployment successful\n\n[Website](https://china.muhammadyana.me)\n\nCommit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
